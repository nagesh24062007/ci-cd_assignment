name: My First CI Pipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  demo:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check HTML File
        run: Test-Path index.html

      - name: Check CSS File
        run: Test-Path style.css

      - name: Check JavaScript File
        run: Test-Path script.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install HTML Validator
        run: python -m pip install html5validator

      - name: Validate HTML
        run: html5validator --root .